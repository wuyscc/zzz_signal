name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: bash -n
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f" || status=1
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --external-sources --severity=style signal.sh tests/*.sh

  safety:
    name: Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check signal.sh for unsafe patterns
        run: bash tests/safety_check.sh signal.sh

      - name: Checker catches a known-unsafe sample
        run: |
          if bash tests/safety_check.sh tests/fixtures/unsafe_sample.sh; then
            echo "::error::safety_check.sh passed a deliberately unsafe file"
            exit 1
          fi
          echo "Unsafe sample was rejected as expected."

  test:
    name: Functional tests
    runs-on: ubuntu-latest
    needs: [syntax]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check dependencies
        run: |
          curl --version | head -n1
          jq --version
          python3 --version

      - name: Run tests (mocked network)
        run: bash tests/test_signal.sh
